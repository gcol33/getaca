url: https://gillescolling.com/getaca/
destination: docs
template:
  bootstrap: 5
  bootswatch: sandstone
  light-switch: yes
  includes:
    in_header: |
      <script>
      (function () {
        var D = String.fromCharCode(36);
        window.MathJax = {
          tex: {
            inlineMath: [[D, D], ["\\(", "\\)"]],
            displayMath: [[D + D, D + D], ["\\[", "\\]"]]
          },
          chtml: { linebreaks: { automatic: true, width: "90% container" } },
          svg: { linebreaks: { automatic: true, width: "90% container" } },
          options: { renderActions: { addMenu: [] } }
        };
      })();
      </script>
home:
  title: 'getaca: Reproducible External Data Dependencies'
  description: |
    Declare, retrieve, verify, track and actively manage external data dependencies for R packages. Pinned to exact bytes, resolvable offline, safe during R CMD check.
authors:
  Gilles Colling:
    href: https://github.com/gcol33
