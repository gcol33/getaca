# Memory safety and undefined behaviour in src/, which R CMD check does not look
# for. The package carries around 1,100 lines of hand-written C -- two digests, a
# signature scheme and the R entry points -- and test-digest.R and test-ed25519.R
# hold all of it against FIPS 180-4 and RFC 8032. A wrong answer is what those
# catch. An out-of-bounds read that happens to return the right digest, a shift
# whose result the standard does not define, or a PROTECT the garbage collector
# will eventually punish are all invisible to them.
#
# The five containers are the ones CRAN's own incoming checks use, so a finding
# here is a finding that would otherwise arrive during a submission.
#
#   clang-asan   out-of-bounds and use-after-free, clang, Ubuntu, R-devel
#   gcc-asan     the same class through a different compiler's codegen, Fedora
#   clang-ubsan  undefined behaviour: signed overflow, bad shifts, pointer
#                overflow. The field arithmetic in ed25519.c is where this bites
#   valgrind     reads of uninitialised memory, which no sanitizer above sees
#   rchk         static analysis of the R API use in init.c: unprotected SEXPs
#                and protection-stack imbalance
#
# Each container ships an `r-check` script that installs dependencies, runs
# R CMD check with the arguments that container wants, and greps the output for
# its own diagnostics. CHECK_ARGS is left at the container's default, which is
# --extra-arch: only the checks that depend on the architecture run, so examples
# and tests execute and the static checks the other workflow already covers do
# not run twice.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # R-devel moves underneath these containers, so they run weekly even when
    # nothing in the package has changed.
    - cron: '0 6 * * 1'
  workflow_dispatch:

name: sanitizers

permissions: read-all

jobs:
  sanitizers:
    runs-on: ubuntu-latest

    name: ${{ matrix.container }}

    # valgrind runs the tests two orders of magnitude slower than native, and
    # every container installs its dependencies from source under instrumentation.
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        container: [clang-asan, gcc-asan, clang-ubsan, valgrind, rchk]

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The containers check a tarball rather than a source tree. Vignettes are
      # not built: nothing in them reaches src/, and building them here would
      # mean knitr and rmarkdown on the runner for no added coverage.
      - name: Build the tarball
        shell: bash
        run: |
          mkdir -p check
          R CMD build --no-build-vignettes --no-manual .
          mv getaca_*.tar.gz check/

      # The container installs the dependencies and runs the check with the
      # arguments it wants, and writes its results into the mount. Its exit
      # status is not the verdict, because no two of these agree on what one
      # means:
      #
      #   clang-asan, clang-ubsan  r-check runs, under `set -e`,
      #     `testfiles=$(ls tests | grep ".Rout.fail$")`, and grep exits 1 when
      #     every test passed, ending the script. A clean check reports failure.
      #   gcc-asan  a different r-check with no diagnostic grep at all, so it
      #     reports whatever R CMD check returned. UBSAN prints and continues
      #     rather than aborting, so a finding that fails no test passes here.
      #   valgrind  the same grep, and a pattern that also matches the stack
      #     frames of leak records R produces by itself.
      #   rchk  prints its findings and always exits 0.
      #
      # So the verdict is read from the check directory, the same way for all
      # five. Upstream, in r-hub/containers.
      - name: Check under ${{ matrix.container }}
        shell: bash
        run: |
          docker run --rm -v "${PWD}/check:/check" \
            "ghcr.io/r-hub/containers/${{ matrix.container }}:latest" \
            r-check 2>&1 | tee container.log
          echo "r-check exit: ${PIPESTATUS[0]} (advisory, see the next step)"
        continue-on-error: true

      - name: Read the verdict
        shell: bash
        run: |
          rcheck=check/getaca.Rcheck
          log="$rcheck/00check.log"
          if [ ! -f "$log" ]; then
            echo "::error::the container produced no 00check.log, so the check did not run"
            exit 1
          fi
          grep -E "^Status:" "$log" || true

          # Only what the check wrote as text. A recursive grep would also read
          # the installed shared object.
          mapfile -t readable < <(find "$rcheck" -type f \
            \( -name '*.Rout' -o -name '*.Rout.fail' -o -name '00check.log' \))
          readable+=(container.log)

          verdict=0
          if grep -qE "^Status:.*ERROR" "$log"; then
            echo "::error::R CMD check reported an ERROR"
            verdict=1
          fi

          case "${{ matrix.container }}" in
            valgrind)
              # One summary per instrumented process, and anything but zero is
              # real. Leak records are not counted: R leaks at exit by design
              # and says nothing about src/. No summary at all means nothing was
              # instrumented, which has to read as a failure rather than as
              # silence.
              summaries=$(grep -hoE "ERROR SUMMARY: [0-9]+ errors" \
                            "${readable[@]}" | sort -u)
              if [ -z "$summaries" ]; then
                echo "::error::valgrind produced no ERROR SUMMARY, so it never ran"
                verdict=1
              elif printf '%s\n' "$summaries" | grep -qvE ": 0 errors"; then
                echo "::error::valgrind reported errors"
                printf '%s\n' "$summaries"
                grep -hE "Invalid (read|write)|uninitialised|Mismatched free" \
                  "${readable[@]}" | sort -u | head -40
                verdict=1
              fi
              ;;
            rchk)
              findings='unprotected|protection stack imbalance|negative depth'
              if grep -hqE "$findings" "${readable[@]}"; then
                echo "::error::rchk reported a protection defect in src/"
                grep -hE "$findings" "${readable[@]}" | sort -u
                verdict=1
              fi
              ;;
            *)
              diagnostics='runtime error:|SUMMARY: [A-Za-z]+Sanitizer:'
              if grep -hqE "$diagnostics" "${readable[@]}"; then
                echo "::error::the sanitizer reported a diagnostic"
                grep -hE "$diagnostics" "${readable[@]}" | sort -u | head -40
                verdict=1
              fi
              ;;
          esac

          if [ "$verdict" -eq 0 ]; then echo "Clean."; fi
          exit $verdict

      - name: Upload the check directory
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.container }}-results
          path: |
            check/getaca.Rcheck
            container.log
          retention-days: 14
